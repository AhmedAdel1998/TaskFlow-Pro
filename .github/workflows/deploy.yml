name: Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  frontend-test:
    # smoke.js drives a real installed Chrome/Edge (not Playwright's own browser download),
    # so this needs a runner that ships one preinstalled — windows-latest includes Edge.
    # It also spins up a throwaway local instance of the API (real login now needs one), so
    # the .NET SDK is required here too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test backend/tests/TaskFlow.IntegrationTests/TaskFlow.IntegrationTests.csproj

  deploy-pages:
    needs: [frontend-test, backend-test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage static site
        env:
          TASKFLOW_API_URL: ${{ vars.TASKFLOW_API_URL }}
        run: node frontend/stage.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
